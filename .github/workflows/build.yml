name: Build BP1048P4 DSP v1.3

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract v1.3 project
        run: |
          unzip -o BP1048P4_DSP_7CH_UI_v1_3.zip -d /tmp/dsp
          cp -a /tmp/dsp/. .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BP1048P4-DSP-7CH-v1.3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
