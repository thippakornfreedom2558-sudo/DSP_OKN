name: Build BP1048P4 DSP APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)
          echo "ZIP: $ZIP"

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          APP_DIR=$(find extracted -type d -name app -print -quit)

          if [ -z "$APP_DIR" ]; then
            echo "ERROR: app folder not found"
            find extracted -maxdepth 4 -type d
            exit 1
          fi

          PROJECT_DIR=$(dirname "$APP_DIR")
          echo "PROJECT: $PROJECT_DIR"

          cp -r "$PROJECT_DIR"/. .

          echo "Project files:"
          ls -la

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BP1048P4-DSP-7CH-APK
          path: app/build/outputs/apk/debug/app-debug.apk
